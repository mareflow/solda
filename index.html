<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setor Solda | TurboSul - Controle de Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-turbo-teal { background-color: #0D9488; }
        .text-turbo-teal { color: #0D9488; }
        .bg-turbo-blue { background-color: #2563EB; }
        .bg-turbo-orange { background-color: #EA580C; }
        .checklist-scroll::-webkit-scrollbar { width: 5px; }
        .checklist-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .checklist-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .os-card-selected { border-left: 4px solid #2563EB; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-4">
            <img src="https://i.postimg.cc/Jh5Jvrc9/IMG-7901.png" alt="TurboSul Logo" class="h-10">
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900 uppercase">TurboSul - Controle de Produção</h1>
                <p class="text-xs text-slate-500 font-medium italic">Setor de Soldagem Especializada</p>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-right border-l pl-6 border-slate-200">
                <p class="text-sm font-bold leading-none">Administrador</p>
                <p class="text-[10px] text-turbo-teal font-bold uppercase tracking-wider">Setor Solda</p>
            </div>
            <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition">Sair</button>
        </div>
    </header>

    <div class="flex h-[calc(100vh-64px)] overflow-hidden">
        <aside class="w-80 bg-white border-r border-slate-200 overflow-y-auto flex-shrink-0">
            <div class="p-4 border-b border-slate-100 bg-slate-50 sticky top-0 z-10">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">Fila de Soldagem</h2>
            </div>
            <div id="os-queue-container" class="divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400 animate-pulse italic">Carregando fila...</div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 bg-slate-50">
            <div id="workspace-header" class="hidden flex flex-col lg:flex-row justify-between gap-4 mb-6">
                <div class="bg-turbo-blue text-white rounded-xl p-5 shadow-lg flex-1 relative overflow-hidden">
                    <div class="relative z-10">
                        <h2 id="current-os-id" class="text-3xl font-black italic">OS-XXXX</h2>
                        <p id="current-os-desc" class="text-sm font-medium opacity-90 uppercase tracking-widest">CLIENTE | MODELO</p>
                    </div>
                    <div class="mt-4 flex space-x-3 relative z-10">
                        <button onclick="openSpecialServiceModal()" class="bg-white/20 hover:bg-white/30 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-wider transition">+ Adicionar Serviço Especial</button>
                    </div>
                </div>

                <div class="bg-slate-900 text-white rounded-xl p-4 flex flex-col justify-between border-b-4 border-turbo-teal lg:w-72 shadow-xl">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-turbo-teal rounded-lg"><i class="fa-solid fa-fire-burner"></i></div>
                        <div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Monitor Solda</p>
                            <p class="text-xs font-black text-white uppercase">Produção Ativa</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400">
                <i class="fa-solid fa-mask-ventilator text-5xl mb-4"></i>
                <p class="text-lg font-bold">Selecione uma Ordem para iniciar a soldagem.</p>
            </div>

            <div id="components-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-24"></div>
        </main>
    </div>

    <!-- MODAL SERVIÇO ESPECIAL -->
    <div id="modal-special" class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border-t-8 border-turbo-blue">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 uppercase italic tracking-tight text-lg">Adicionar Serviço Especial</h3>
                <button onclick="closeSpecialServiceModal()" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-8 space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Item / Processo Extra</label>
                    <input type="text" id="special-item-name" oninput="validateSpecialModal()" placeholder="EX: SOLDA EM SUPORTE, RECUPERAÇÃO CARCAÇA..." class="w-full bg-slate-100 border-2 border-transparent focus:border-turbo-blue rounded-2xl px-5 py-4 text-sm font-bold outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <label onclick="toggleSpecialRadioStyle('PADRAO')" id="label-padrao" class="flex items-center p-4 border-2 rounded-2xl cursor-pointer transition-all border-blue-600 bg-blue-50/50">
                        <input type="radio" name="special-type" value="PADRAO" checked class="hidden">
                        <span class="text-[11px] font-black text-blue-800 uppercase">Peça Padrão</span>
                    </label>
                    <label onclick="toggleSpecialRadioStyle('RETRABALHO')" id="label-retrabalho" class="flex items-center p-4 border-2 border-slate-100 rounded-2xl cursor-pointer transition-all hover:bg-slate-50">
                        <input type="radio" name="special-type" value="RETRABALHO" class="hidden">
                        <span class="text-[11px] font-black text-red-700/60 uppercase">Retrabalho</span>
                    </label>
                </div>
                <div class="flex space-x-3 pt-6 border-t">
                    <button onclick="closeSpecialServiceModal()" class="flex-1 bg-slate-100 text-slate-400 font-black py-4 rounded-2xl uppercase text-[10px]">Cancelar</button>
                    <button id="btn-add-special" disabled onclick="addSpecialCard()" class="flex-[2] bg-turbo-blue/40 text-white font-black py-4 rounded-2xl uppercase text-[10px] cursor-not-allowed">Adicionar Item</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAÇÃO ROTEAMENTO -->
    <div id="modal-confirm-routing" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center border-t-8 border-turbo-teal">
            <div class="w-20 h-20 bg-teal-50 text-turbo-teal rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-paper-plane text-3xl"></i></div>
            <h4 class="text-xl font-black text-slate-800 mb-2 uppercase italic">Encaminhar Peça?</h4>
            <p id="routing-confirm-msg" class="text-slate-500 text-sm mb-6 font-medium"></p>
            <div class="flex gap-3">
                <button onclick="closeRoutingModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl uppercase text-[10px]">Cancelar</button>
                <button id="btn-confirm-routing-final" class="flex-1 bg-turbo-teal text-white font-bold py-3 rounded-xl shadow-lg uppercase text-[10px]">Sim, Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API_QUEUE = 'https://webhook.mareflow.com.br/webhook/production/welding-queue';
        const API_ACTION = 'https://webhook.mareflow.com.br/webhook/production/component-routing';
        
        let selectedOS = null;
        let queueData = [];
        let specialItemsList = [];

        // Itens de Solda extraídos da planilha
        const WELD_SERVICES = [
            "SOLDAGEM EMB. CT", "SOLDAGEM TRINCAS", "SOLDAGEM ASSENT. CCE", "SOLDAGEM ASSENT. WASTEGATE",
            "SOLDAGEM SAÍDA CT", "SOLDAGEM PÉ / MESA", "SOLDAGEM BORDA QUENTE CCE", "SOLDAGEM BORDA FRIA CCE",
            "SOLDAGEM BOCAL ADMISSÃO", "SOLDAGEM BOCAL FILTRO", "SOLDAGEM EMB. CCO", "SOLDAGEM MESA COLETOR",
            "SOLDAGEM TRINCAS COLETOR", "SOLDAGEM ASPERSÃO TÉRMICA (EIXO)", "SOLDAGEM PALHETA EIXO",
            "SOLDAGEM PALHETA ROTOR", "SOLDAGEM SAÍDA (FLANGE / BOTA)", "SOLDA WASTEGATE",
            "SOLDA MARÍTIMA - CICLO 1", "SOLDA MARÍTIMA - CICLO 2", "SOLDAGEM CABEÇOTE VALV. MARÍTIMA"
        ];

        window.addEventListener('load', fetchQueue);

        async function fetchQueue() {
            try {
                const response = await fetch(API_QUEUE);
                const result = await response.json();
                queueData = Array.isArray(result) ? result : (result.data || (result.business_id ? [result] : []));
                renderQueue();
            } catch (error) {
                document.getElementById('os-queue-container').innerHTML = '<p class="p-4 text-red-500 text-xs">Erro de conexão.</p>';
            }
        }

        function renderQueue() {
            const container = document.getElementById('os-queue-container');
            container.innerHTML = queueData.map(os => `
                <div onclick="selectOS('${os.id}')" class="p-4 cursor-pointer hover:bg-slate-50 transition border-l-4 ${selectedOS?.id === os.id ? 'os-card-selected border-blue-600' : 'border-transparent'}">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-sm font-black text-slate-900">${os.business_id}</span>
                        <span class="px-2 py-0.5 text-[9px] font-bold rounded uppercase bg-blue-100 text-blue-600">${os.urgency || 'Normal'}</span>
                    </div>
                    <p class="text-[10px] font-bold text-turbo-blue uppercase truncate">${os.client}</p>
                    <p class="text-xs text-slate-500 font-medium">${os.model}</p>
                </div>
            `).join('');
        }

        function selectOS(id) {
            selectedOS = queueData.find(o => o.id === id);
            specialItemsList = [];
            renderQueue();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('workspace-header').classList.remove('hidden');
            document.getElementById('components-grid').classList.remove('hidden');
            document.getElementById('current-os-id').innerText = selectedOS.business_id;
            document.getElementById('current-os-desc').innerText = `${selectedOS.model} | ${selectedOS.client}`;
            renderComponentCards();
        }

        function renderComponentCards() {
            const grid = document.getElementById('components-grid');
            if (!grid || !selectedOS) return;

            const componentsFromDB = selectedOS.components_to_render || [];
            const allToRender = [
                ...componentsFromDB.map(name => ({ title: name, isSpecial: false })),
                ...specialItemsList
            ];

            grid.innerHTML = allToRender.map(comp => {
                const trk = (selectedOS.tracking || []).find(t => (t.component_name === comp.title || t.component === comp.title));
                const isSent = !!trk && trk.current_stage !== 'SOLDA';
                
                const cardStyle = isSent ? 'opacity-40 grayscale pointer-events-none' : '';
                const badgeText = isSent ? `EM ${trk.current_stage}` : (comp.isSpecial ? comp.type : 'Solda');
                
                return `
                    <div class="bg-white rounded-3xl shadow-sm border-2 border-slate-100 flex flex-col p-6 ${cardStyle}" id="comp-card-${comp.title.replace(/\s+/g, '-')}">
                        <div class="flex justify-between items-center mb-6">
                            <h4 class="text-2xl font-black text-slate-800 tracking-tighter uppercase italic">${comp.title}</h4>
                            <span class="text-[10px] font-black uppercase px-4 py-1.5 ${isSent ? 'bg-slate-500' : 'bg-turbo-teal'} text-white rounded-full">${badgeText}</span>
                        </div>
                        <div class="flex-1 flex flex-col">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Checklist de Soldagem:</p>
                            <div class="checklist-scroll overflow-y-auto max-h-[180px] space-y-1 mb-8 pr-1">
                                ${WELD_SERVICES.map(i => `<label class="flex items-center space-x-3 py-1.5 cursor-pointer group"><input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-turbo-teal" data-item="${i}"><span class="text-xs font-bold text-slate-500 group-hover:text-slate-800">${i}</span></label>`).join('')}
                            </div>
                            <hr class="border-slate-100 mb-6">
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="sendPieceTo(this, '${comp.title}', 'RETIFICA')" class="py-3 bg-slate-50 text-[10px] font-black uppercase rounded-lg hover:bg-slate-100">Retífica</button>
                                <button onclick="sendPieceTo(this, '${comp.title}', 'METROLOGIA')" class="py-3 bg-slate-50 text-[10px] font-black uppercase rounded-lg hover:bg-slate-100">Metrologia</button>
                                <button onclick="sendPieceTo(this, '${comp.title}', 'BANCADA')" class="py-3 bg-slate-50 text-[10px] font-black uppercase rounded-lg hover:bg-slate-100">Bancada</button>
                                <button onclick="sendPieceTo(this, '${comp.title}', 'MONTAGEM')" class="col-span-2 py-4 bg-emerald-600 text-white text-[11px] font-black uppercase rounded-xl shadow-lg mt-2">Pronto p/ Montagem</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function sendPieceTo(btn, componentName, targetSector) {
            const modal = document.getElementById('modal-confirm-routing');
            const msg = document.getElementById('routing-confirm-msg');
            const confirmBtn = document.getElementById('btn-confirm-routing-final');
            modal.classList.remove('hidden');
            msg.innerText = `Enviar ${componentName} para ${targetSector}?`;
            confirmBtn.onclick = async () => {
                modal.classList.add('hidden');
                const card = document.getElementById(`comp-card-${componentName.replace(/\s+/g, '-')}`);
                const services = Array.from(card.querySelectorAll('input:checked')).map(cb => cb.dataset.item);
                btn.disabled = true;
                try {
                    const response = await fetch(API_ACTION, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ os_id: selectedOS.os_id || selectedOS.id, component: componentName, target: targetSector, executed_services: services })
                    });
                    if (response.ok) {
                        card.classList.add('opacity-40', 'grayscale', 'pointer-events-none');
                        btn.innerHTML = `ENCAMINHADO`;
                        btn.className = "col-span-2 py-4 bg-slate-800 text-white text-[11px] font-black uppercase rounded-xl mt-2";
                    }
                } catch (e) { alert("Erro ao enviar."); btn.disabled = false; }
            };
        }

        function openSpecialServiceModal() { document.getElementById('special-item-name').value = ''; validateSpecialModal(); document.getElementById('modal-special').classList.remove('hidden'); }
        function closeSpecialServiceModal() { document.getElementById('modal-special').classList.add('hidden'); }
        function validateSpecialModal() {
            const name = document.getElementById('special-item-name').value;
            const btn = document.getElementById('btn-add-special');
            btn.disabled = name.length < 3;
            btn.className = btn.disabled ? 'flex-[2] bg-turbo-blue/40 text-white font-black py-4 rounded-2xl uppercase text-[10px] cursor-not-allowed' : 'flex-[2] bg-turbo-blue text-white font-black py-4 rounded-2xl uppercase text-[10px] shadow-lg cursor-pointer';
        }
        function toggleSpecialRadioStyle(type) {
            const isR = type === 'RETRABALHO';
            document.getElementById('label-padrao').className = !isR ? 'flex items-center p-4 border-2 rounded-2xl cursor-pointer bg-blue-50/50 border-blue-600' : 'flex items-center p-4 border-2 border-slate-100 rounded-2xl cursor-pointer';
            document.getElementById('label-retrabalho').className = isR ? 'flex items-center p-4 border-2 rounded-2xl cursor-pointer bg-red-50/50 border-red-500' : 'flex items-center p-4 border-2 border-slate-100 rounded-2xl cursor-pointer';
        }
        function addSpecialCard() {
            const name = document.getElementById('special-item-name').value.toUpperCase();
            const type = document.querySelector('input[name="special-type"]:checked')?.value || 'PADRAO';
            specialItemsList.push({ title: name, type: type, isSpecial: true });
            closeSpecialServiceModal();
            renderComponentCards();
        }
        function closeRoutingModal() { document.getElementById('modal-confirm-routing').classList.add('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
